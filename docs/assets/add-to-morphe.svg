<svg width="320" height="56" viewBox="0 0 320 56"
    xmlns="http://www.w3.org/2000/svg"
    role="img" aria-label="Add Flexboard to Morphe">

    <!-- Morphe's brand gradient, taken from its own logo and download button:
         #1E5AA8 is the light-theme accent, #00AFAE the dark-theme one. -->
    <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E5AA8"/>
            <stop offset="100%" stop-color="#00AFAE"/>
        </linearGradient>
    </defs>

    <!-- Button background -->
    <rect x="0" y="0" width="320" height="56" rx="12" ry="12"
        fill="url(#gradient)"/>

    <!-- Plus-in-circle: this adds a source rather than downloading anything -->
    <g transform="translate(28 16)"
        stroke="white"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 12h8"/>
        <path d="M12 8v8"/>
    </g>

    <!-- Centred in the space right of the icon rather than pinned to a start x, so a
         wider or narrower system font stays balanced instead of drifting toward one edge. -->
    <text x="188" y="35"
        fill="white"
        font-size="16"
        font-weight="600"
        text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,sans-serif">
        Add Flexboard to Morphe
    </text>
</svg>
