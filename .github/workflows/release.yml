name: Release

# Bumping the version *is* the release.
#
# Every push compiles. A push that also changes `version` in gradle.properties to something not yet
# tagged builds the bundle, writes patches-bundle.json, tags, and publishes. Nothing else triggers a
# release, so commit to dev as often as you like.
#
# The rule is "gradle.properties says X and no vX tag exists", not "the file changed in this
# commit". That is idempotent: amends, force-pushes, re-runs and two-commits-in-one-push all behave,
# and re-running on an already-released version is a no-op rather than a duplicate.
#
# **The branch is the channel.** Morphe fetches `<branch>/patches-bundle.json` for a custom source
# and rewrites the branch segment when the user toggles pre-releases; `dev` and `main` are
# compile-time constants in the manager. dev publishes a pre-release, main a stable one.
#
# To release from a phone, edit the version line on github.com and commit. workflow_dispatch takes
# no input — it just re-evaluates the same rule, for re-running a failed run.
#
# See docs/releasing.md.

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # Decides, before anything is built, whether this push is a release and what version it is.
      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^version *= *(.+)$/\1/p' gradle.properties | tr -d '[:space:]')

          if [ -z "$VERSION" ]; then
            echo "::error::No 'version =' line in gradle.properties."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released. Compiling only."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new. This push releases it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "mpp=patches/build/libs/patches-$VERSION.mpp" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Rejected before the build, so a bad version costs seconds. Same script the local helper
      # runs, so there is one definition of "valid" rather than two that drift.
      - name: Validate the version
        if: steps.decide.outputs.release == 'true'
        run: .github/scripts/check_version.sh "${{ steps.decide.outputs.version }}" "$GITHUB_REF_NAME"

      # A source-level invariant, so it runs on every push rather than only on releases: the
      # preference keys and defaults are deliberately duplicated across the patches and the
      # extension DEX, and nothing about changing one alone fails to compile.
      - name: Check the patch and the extension agree
        run: .github/scripts/check_shared_constants.py

      # Runs on every push. When this is a release it also produces the artifact; when it is not,
      # it is the compile check. One code path either way.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew buildAndroid --no-daemon

      # download_url is built from the version, so a filename that disagrees would publish a bundle
      # nobody can download. Asserted rather than assumed.
      - name: Check the bundle filename
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          if [ ! -f "${{ steps.decide.outputs.mpp }}" ]; then
            echo "::error::Expected ${{ steps.decide.outputs.mpp }}, but the build produced:"
            ls -1 patches/build/libs/ || true
            exit 1
          fi

      # This re-runs `jar` and so DESTROYS the classes.dex that `buildAndroid` merged in — see the
      # re-merge step below, which must stay after it.
      - name: Regenerate the patch inventory
        if: steps.decide.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew generatePatchesList --no-daemon
          jq --arg v "$VERSION" '.version = $v' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json
          python3 .github/scripts/generate_patches_readme.py \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" patches-list.json README.md

      # `buildAndroid` compiles the patches to DEX and merges classes.dex *into the jar that `jar`
      # already wrote*, mutating it in place. Any later Gradle run that re-runs `jar` — and
      # generatePatchesList does, via `build` — sees a changed output, rebuilds the archive, and
      # drops the DEX. So the merge has to be the last thing that touches the file.
      #
      # The manager loads patches on Android through a DEX class loader. Without classes.dex the
      # bundle still downloads, still parses, still reports its name and version, and contains
      # every patch as a JVM .class — and offers zero patches on device. That is what shipped in
      # v0.0.0 through v1.0.0. The template avoided it only by ordering: semantic-release ran
      # generatePatchesList in `prepare`, then `./gradlew publish` in `publish`, and the Morphe
      # Gradle plugin hangs buildAndroid off `publish`.
      - name: Re-merge the Android DEX
        if: steps.decide.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew buildAndroid --no-daemon

      # The one check that would have caught the above. Everything else about a DEX-less bundle
      # looks correct, including the post-publish verification, which compared the uploaded asset
      # against the same broken file it was built from.
      - name: Check the bundle is loadable on Android
        if: steps.decide.outputs.release == 'true'
        env:
          MPP: ${{ steps.decide.outputs.mpp }}
          EXPECTED_PACKAGE: com.google.android.inputmethod.latin
        run: |
          set -euo pipefail
          if ! unzip -l "$MPP" | grep -qE '[[:space:]]classes\.dex$'; then
            echo "::error::$MPP contains no classes.dex, so Morphe would load zero patches from it."
            unzip -l "$MPP" | head -20
            exit 1
          fi
          echo "classes.dex present:"
          unzip -l "$MPP" | grep -E '[[:space:]]classes\.dex$'

          # Everything below fails the same way classes.dex did: the bundle loads, reports the right
          # name and version, and simply does nothing useful. All three are one command each.
          if ! unzip -l "$MPP" | grep -qE '[[:space:]]extensions/extension\.mpe$'; then
            echo "::error::$MPP has no extensions/extension.mpe. The settings screen and every" \
                 "call a patch makes into the extension would fail at patch time."
            exit 1
          fi

          COUNT=$(jq '.patches | length' patches-list.json)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::patches-list.json declares $COUNT patches. The bundle would install and" \
                 "offer nothing."
            exit 1
          fi

          if ! jq -e --arg p "$EXPECTED_PACKAGE" \
              '[.patches[].compatiblePackages[]?.packageName] | index($p)' \
              patches-list.json > /dev/null; then
            echo "::error::No patch declares compatibility with $EXPECTED_PACKAGE, so Morphe would" \
                 "never offer it as a target. Declared:"
            jq -r '[.patches[].compatiblePackages[]?.packageName] | unique[]' patches-list.json
            exit 1
          fi

          echo "$COUNT patches, extension bundled, $EXPECTED_PACKAGE declared."

      # This file *is* the release as far as Morphe is concerned; the GitHub release is only where
      # the .mpp lives. created_at must carry no timezone — the manager parses it as a kotlinx
      # LocalDateTime, and a trailing Z fails deserialisation with no useful error.
      - name: Write patches-bundle.json
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail

          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            NOTES=$(git log --no-merges --format='- %s' "$PREVIOUS..HEAD")
          else
            NOTES=$(git log --no-merges --format='- %s' -20)
          fi
          [ -n "$NOTES" ] || NOTES="- No changes recorded."
          DESCRIPTION=$(printf '## %s\n\n%s\n' "$VERSION" "$NOTES")
          printf '%s' "$DESCRIPTION" > release-notes.md

          jq -n \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg description "$DESCRIPTION" \
            --arg download_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/patches-$VERSION.mpp" \
            --arg version "$VERSION" \
            '{created_at: $created_at,
              description: $description,
              download_url: $download_url,
              signature_download_url: "",
              version: $version}' > patches-bundle.json

          cat patches-bundle.json

      # Morphe fetches CHANGELOG.md from the branch root — it derives the URL from the source
      # endpoint by swapping the filename — and parses it for in-app changelog entries. The heading
      # format is not free-form: ChangelogParser wants conventional-changelog's
      # `# [VERSION](url) (YYYY-MM-DD)` or a bare `# VERSION (YYYY-MM-DD)`, and silently skips any
      # heading it does not recognise. The template's @MorpheApp/changelog plugin wrote this; the
      # hand-written pipeline has to do it too.
      - name: Prepend the changelog entry
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail

          # Bullets must be SCOPED — `* **Gboard:** text`. hasChangesFor() only ever looks at
          # scopedBullets, so an unscoped changelog parses fine and then reports no changes for any
          # app. That is worse than having no changelog at all: with none, the manager fails open and
          # still shows the "re-patch this app" badge. The scope has to equal the app name the
          # manager resolves, which is the display name the bundle itself declares — so it is read
          # back out of patches-list.json rather than written twice.
          SCOPE=$(jq -r '[.patches[].compatiblePackages[]?.name] | map(select(. != null)) | unique | first // "Patches"' patches-list.json)

          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            HEADING="# [$VERSION](https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$TAG) ($(date -u +%Y-%m-%d))"
            RANGE="$PREVIOUS..HEAD"
          else
            # No previous tag to compare against, so the bare-token heading form, which the parser
            # accepts precisely for a first release.
            HEADING="# $VERSION ($(date -u +%Y-%m-%d))"
            RANGE=""
          fi

          # The conventional-commit type is dropped from the body: conventional-changelog groups by
          # type under its own headings rather than repeating it inline, and the parser strips
          # everything up to the scope marker anyway.
          if [ -n "$RANGE" ]; then
            SUBJECTS=$(git log --no-merges --format='%s' "$RANGE")
          else
            SUBJECTS=$(git log --no-merges --format='%s' -20)
          fi
          BULLETS=$(printf '%s\n' "$SUBJECTS" \
            | sed -E 's/^(feat|fix|chore|docs|perf|refactor|style|test|build|ci|bump)(\([^)]*\))?!?: //' \
            | sed -E "s|^|* **$SCOPE:** |")
          [ -n "$SUBJECTS" ] || BULLETS="* **$SCOPE:** No changes recorded."

          touch CHANGELOG.md
          { printf '%s\n\n%s\n\n' "$HEADING" "$BULLETS"; cat CHANGELOG.md; } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          head -10 CHANGELOG.md

      # Commit and tag together, then push together, so the tag can never be left behind.
      - name: Commit and tag
        if: steps.decide.outputs.release == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json README.md CHANGELOG.md
          git commit -m "chore: release $TAG [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          # --atomic, because two refspecs in one command are still two updates: without it the
          # branch can land while the tag is rejected, which is exactly the "tag left behind by a
          # rewrite" state the release model claims cannot happen. Either both move or neither does.
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$TAG"

      - name: Publish the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          MPP: ${{ steps.decide.outputs.mpp }}
          PRERELEASE: ${{ steps.decide.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Labelled for the humans reading the releases page. Morphe ignores this and goes by the
          # branch, but the page disagreeing with the channel would be odd.
          FLAG=""
          [ "$PRERELEASE" = "true" ] && FLAG="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" "$MPP" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --target "$GITHUB_REF_NAME" \
            $FLAG

      # Every Morphe-side failure here is silent — a bad created_at never appears, a broken
      # download_url shows an update that fails on tap. Without a manual release step there is no
      # moment where anyone is watching, so the run proves its own work.
      - name: Verify the release
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
          MPP: ${{ steps.decide.outputs.mpp }}
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/patches-bundle.json"

          # Fetch what a phone would actually fetch, not what we wrote. The raw CDN lags, so retry.
          PUBLISHED=""
          for attempt in 1 2 3 4 5 6; do
            PUBLISHED=$(curl -fsSL "$RAW?cachebust=$(date +%s)" || true)
            [ -n "$PUBLISHED" ] && [ "$(printf '%s' "$PUBLISHED" | jq -r '.version')" = "$VERSION" ] && break
            echo "raw CDN not caught up yet (attempt $attempt); waiting"
            sleep 15
            PUBLISHED=""
          done
          if [ -z "$PUBLISHED" ]; then
            echo "::error::$RAW never served version $VERSION. Morphe would not see this release."
            exit 1
          fi

          printf '%s' "$PUBLISHED" | jq -e '
            (.download_url | type == "string" and length > 0)
            and (.version | type == "string" and length > 0)
            and (.description | type == "string" and length > 0)
            and (.created_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$"))
          ' > /dev/null || {
            echo "::error::patches-bundle.json is not loadable by Morphe. Required: download_url," \
                 "version, description, and a timezone-less created_at."
            printf '%s\n' "$PUBLISHED"
            exit 1
          }

          [ "$(printf '%s' "$PUBLISHED" | jq -r '.version')" = "${TAG#v}" ] || {
            echo "::error::version disagrees with the tag $TAG."; exit 1; }

          # The asset must actually be downloadable, and be the file that was built.
          URL=$(printf '%s' "$PUBLISHED" | jq -r '.download_url')
          curl -fsSL "$URL" -o downloaded.mpp || {
            echo "::error::download_url does not resolve: $URL"; exit 1; }
          cmp -s downloaded.mpp "$MPP" || {
            echo "::error::The published asset differs from the bundle that was built."; exit 1; }
          rm -f downloaded.mpp

          echo "Verified: $RAW serves $VERSION and its download_url matches the built bundle."

      - name: Attest
        if: steps.decide.outputs.release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.decide.outputs.tag }}'
          subject-path: ${{ steps.decide.outputs.mpp }}
