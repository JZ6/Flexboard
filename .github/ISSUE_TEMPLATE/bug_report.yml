name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Flexboard bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/JZ6/Flexboard/issues?q=label%3Abug).
        - **Flexboard targets one Gboard build:** `18.0.3.954559732-release-arm64-v8a`. Other versions are unsupported; the patcher may still apply part of a patch, so a successful install does not prove compatibility.
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: input
    attributes:
      label: Gboard version
      description: The exact version you patched, from the APK filename or Gboard's own settings.
      placeholder: 18.0.3.954559732-release-arm64-v8a
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: If Swipe up to undo autocorrect is selected, a crash report may be on the clipboard after restarting the keyboard. Otherwise capture logs with `adb logcat` and look for `AndroidRuntime`.
      render: shell
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
